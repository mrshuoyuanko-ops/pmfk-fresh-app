name: Build Installers

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win nsis
            name: windows
          - os: macos-latest
            args: --mac dmg
            name: macos
          - os: ubuntu-24.04
            args: --linux AppImage deb
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set packaged app URL
        run: |
          node -e "const fs=require('fs'); fs.writeFileSync('electron/config.json', JSON.stringify({url: process.env.PMFK_URL}, null, 2) + '\\n')"
        env:
          PMFK_URL: ${{ vars.PMFK_URL || 'https://pmfk.onrender.com' }}
      - run: npx electron-builder ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: pmfk-${{ matrix.name }}
          path: release/*

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.PMFK_URL || 'https://pmfk.onrender.com' }}
      - run: npx cap add android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: pmfk-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
