appId: com.shawnkong.pmfk
productName: Pocket Money For Kids
copyright: Made by Shawn Kong

directories:
  output: release

files:
  - electron/**/*
  - public/icons/icon-512.png
  - package.json

win:
  icon: public/icons/icon-512.png
  target:
    - nsis

mac:
  icon: public/icons/icon-512.png
  target:
    - dmg
  category: public.app-category.education

linux:
  icon: public/icons/icon-512.png
  target:
    - AppImage
    - deb
  category: Education
  maintainer: Shawn Kong

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
